<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening in Claude…</title>
<style>body{font:15px -apple-system,system-ui,sans-serif;color:#333;max-width:36em;margin:4em auto;padding:0 1em}a{color:#2f6db5}</style>
<p id="msg">Opening in the Claude app…</p>
<script>
(function(){
  // Routes (everything lives in the URL hash, which never reaches the server):
  //   #artifact/<id>                 -> claude://claude.ai/artifact/<id>
  //   #code?folder=<path>&q=<prompt> -> claude://code/new?folder=<path>&q=<prompt>  (new Claude Code session)
  var h = (location.hash || '').replace(/^#/, '');
  var msg = document.getElementById('msg');
  var app = null, web = null;
  var m = /^artifact\/([A-Za-z0-9_-]{6,64})$/.exec(h);
  if (m) {
    app = 'claude://claude.ai/artifact/' + m[1];
    web = 'https://claude.ai/artifact/' + m[1];
  } else if (/^code(\?|$)/.test(h)) {
    var params = new URLSearchParams(h.replace(/^code\??/, ''));
    var out = new URLSearchParams();
    params.getAll('folder').forEach(function (f) { if (f) out.append('folder', f); });
    var q = params.get('q'); if (q) out.set('q', q.slice(0, 4000));
    out.set('source', 'open-in-claude');
    app = 'claude://code/new?' + out.toString();
  }
  if (!app) { msg.textContent = 'Nothing to open.'; return; }
  location.replace(app);
  setTimeout(function(){
    msg.innerHTML = 'If the Claude app did not open, <a href="' + app.replace(/"/g, '&quot;') + '">open it in the app</a>' +
      (web ? ' or <a href="' + web + '">open it in the browser</a>' : '') + '. You can close this tab.';
  }, 1200);
})();
</script>
